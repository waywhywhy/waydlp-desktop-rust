# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# waydlp is GPL-3.0-or-later; every dependency license below is compatible.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "BSL-1.0", "CC0-1.0",
  "OFL-1.1", "Ubuntu-font-1.0", "LicenseRef-UFL-1.0", "GPL-3.0-or-later", "GPL-3.0", "0BSD",
  "CDLA-Permissive-2.0", "Unlicense", "bzip2-1.0.6", "LGPL-2.1-or-later", "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
